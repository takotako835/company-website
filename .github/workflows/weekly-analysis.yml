# 週次の自動分析を起動する(毎週月曜 9:00 JST)。
# リポジトリの Settings → Secrets and variables → Actions に以下を登録すること:
#   ANALYZE_URL    例: https://maido-crafts-website.onrender.com/api/analyze
#   ANALYZE_SECRET Render の環境変数 ANALYZE_SECRET と同じ値
name: weekly-analysis

on:
  schedule:
    - cron: '0 0 * * 1' # 月曜 00:00 UTC = 9:00 JST
  workflow_dispatch: {} # 手動実行も可能

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Call analyze endpoint
        run: |
          # ★このワークフローの版。ログの先頭に出るので、古い版で実行していないか確認できる
          echo "workflow version: v2 (JSON POST)"

          if [ -z "${{ secrets.ANALYZE_URL }}" ]; then
            echo "ANALYZE_URL secret is not set; skipping."
            exit 0
          fi
          if [ -z "${{ secrets.ANALYZE_SECRET }}" ]; then
            echo "::error::ANALYZE_SECRET secret is not set."
            exit 1
          fi

          # Content-Type: application/json を付けることで、
          # ブラウザのフォーム投稿を防ぐCSRF保護の対象外になる(保護自体は維持される)
          status=$(curl -sS -o response.txt -w '%{http_code}' -X POST "${{ secrets.ANALYZE_URL }}" \
            -H "x-analyze-secret: ${{ secrets.ANALYZE_SECRET }}" \
            -H "Content-Type: application/json" \
            --data '{}')

          echo "HTTP status: $status"
          echo "response: $(cat response.txt)"

          case "$status" in
            2*) echo "分析が完了しました。" ;;
            401) echo "::error::合言葉が一致しません。GitHubの ANALYZE_SECRET と Render の ANALYZE_SECRET を同じ値にしてください。"; exit 1 ;;
            403) echo "::error::古い版のワークフローで実行された可能性があります。Actions → weekly-analysis → Run workflow から新規実行してください。"; exit 1 ;;
            503) echo "::error::Supabaseが未設定です。Render に SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY を設定してください。"; exit 1 ;;
            *) echo "::error::分析の起動に失敗しました (HTTP $status)"; exit 1 ;;
          esac
