# Render Blueprint — このファイルがあれば Render 側の設定入力はほぼ不要になる
# 手順は docs/07_deploy-render.md を参照
services:
  - type: web
    runtime: static
    name: maido-crafts-website
    # 静的サイト(Static Site)は Render の無料プランで運用できる
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # main への push で自動デプロイ
    autoDeploy: true

    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      # 公開URL。canonical / OGP / sitemap / robots.txt に反映される。
      # 初回デプロイ後に実際のURLを確認し、独自ドメイン設定時はその値に変更する
      - key: SITE_URL
        value: https://maido-crafts-website.onrender.com

    headers:
      # セキュリティヘッダ(docs/05_tech-spec.md §5)
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      # ハッシュ付きファイル名なので長期キャッシュしてよい
      - path: /_astro/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
