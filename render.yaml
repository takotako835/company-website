# Render Blueprint — このファイルがあれば Render 側の設定入力はほぼ不要になる
# 手順は docs/07_deploy-render.md を参照
#
# 注意: 静的サイト(runtime: static)は Render のグローバルCDNから配信されるため、
# `region` と `plan` は指定できない(指定すると Blueprint の同期に失敗する)。
services:
  - type: web
    runtime: static
    name: maido-crafts-website
    branch: main
    # `npm ci` は使わない。vite が依存する rolldown のネイティブバイナリが
    # npm の既知バグ(npm/cli#4828)でインストールされず、ビルドが失敗するため。
    #
    # node_modules も必ず消すこと。Render はビルド間で node_modules をキャッシュするため、
    # 残っていると npm install が「up to date」と判断して壊れたツリーを直さない。
    buildCommand: rm -rf node_modules package-lock.json && npm install --no-audit --no-fund && npm run build
    staticPublishPath: ./dist
    # main への push で自動デプロイ
    autoDeploy: true

    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      # 公開URL。canonical / OGP / sitemap / robots.txt に反映される。
      # 初回デプロイ後に実際のURLを確認し、独自ドメイン設定時はその値に変更する
      - key: SITE_URL
        value: https://maido-crafts-website.onrender.com

    headers:
      # セキュリティヘッダ(docs/05_tech-spec.md §5)
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      # ハッシュ付きファイル名なので長期キャッシュしてよい
      - path: /_astro/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
