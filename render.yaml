# Render Blueprint — このファイルがあれば Render 側の設定入力はほぼ不要になる
# 手順は docs/07_deploy-render.md を参照
#
# ★秘密の値(Resend の API キーなど)はここに書かない。
#   sync: false の項目は Render の画面で1つずつ入力する。
services:
  - type: web
    runtime: node
    name: maido-crafts-website
    # ★Free にすると15分で停止し、次の訪問者が約1分待たされる。
    #   コーポレートサイトなので常時起動にする
    plan: starter
    region: singapore
    branch: main
    healthCheckPath: /healthz
    autoDeploy: true

    # `npm ci` は使わない。vite が依存する rolldown のネイティブバイナリが
    # npm の既知バグ(npm/cli#4828)でインストールされず、ビルドが失敗するため。
    #
    # node_modules も必ず消すこと。Render はビルド間で node_modules をキャッシュするため、
    # 残っていると npm install が「up to date」と判断して壊れたツリーを直さない。
    buildCommand: rm -rf node_modules package-lock.json && npm install --no-audit --no-fund && npm run build
    startCommand: node ./dist/server/entry.mjs

    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: NODE_ENV
        value: production
      # ★必須。これがないと Astro のサーバーは localhost だけで待ち受け、
      #   Render から到達できず「No open ports detected on 0.0.0.0」で失敗する
      - key: HOST
        value: 0.0.0.0
      # PORT は Render が自動で渡すため、ここでは指定しない
      # 公開URL。canonical / OGP / sitemap / robots.txt に反映される。
      # 初回デプロイ後に実際のURLを確認し、独自ドメイン設定時はその値に変更する
      - key: SITE_URL
        value: https://maido-crafts-website.onrender.com

      # ── メールの送信(Resend)。Render の画面で入力する ──
      # ★API キーは秘密。リポジトリには絶対に書かない
      - key: RESEND_API_KEY
        sync: false
      # 差出人。ドメインは Resend で認証したものにする
      # 例: maido&crafts strategy <no-reply@ywc-maido.com>
      - key: MAIL_FROM
        sync: false
      # お問い合わせの届け先(社内の受信アドレス)
      - key: CONTACT_TO
        sync: false

      # ── アクセス計測・管理画面・自動改善(docs/08 参照)。Render の画面で入力 ──
      # Supabase の Project Settings → API の値。★service_role キーは秘密
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # 管理画面(/admin)のパスワード
      - key: ADMIN_PASSWORD
        sync: false
      # 週次分析の起動を守る合言葉+訪問者ハッシュのソルト。Generateで自動生成してよい
      - key: ANALYZE_SECRET
        generateValue: true
      # 週次分析のAIレポート用(Anthropic の API キー)。未設定でも数値レポートは出る
      - key: ANTHROPIC_API_KEY
        sync: false
      # 週次レポートの宛先(未設定なら CONTACT_TO と同じ宛先に送る)
      - key: REPORT_TO
        sync: false
